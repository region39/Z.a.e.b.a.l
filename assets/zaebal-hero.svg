<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="50%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#ff6b35;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:0"/>
    </linearGradient>
    <filter id="neonBlue">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonOrange">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a3a" stroke-width="0.5"/>
    </pattern>
    <pattern id="codeRain" width="100" height="100" patternUnits="userSpaceOnUse">
      <text x="10" y="20" fill="#00d4ff" font-size="8" opacity="0.08" font-family="monospace">01</text>
      <text x="50" y="50" fill="#00d4ff" font-size="6" opacity="0.06" font-family="monospace">10</text>
      <text x="30" y="80" fill="#00d4ff" font-size="7" opacity="0.05" font-family="monospace">01</text>
      <text x="70" y="30" fill="#00d4ff" font-size="5" opacity="0.07" font-family="monospace">10</text>
      <text x="80" y="70" fill="#00d4ff" font-size="6" opacity="0.04" font-family="monospace">01</text>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <rect width="1200" height="400" fill="url(#codeRain)"/>

  <!-- Glow lines -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#glow1)"/>
  <rect x="0" y="397" width="1200" height="3" fill="url(#glow2)"/>

  <!-- Circuit board traces -->
  <g stroke="#00d4ff" stroke-width="1" fill="none" opacity="0.15">
    <path d="M 50 350 L 50 300 L 100 300 L 100 250"/>
    <circle cx="100" cy="250" r="3" fill="#00d4ff"/>
    <path d="M 150 100 L 150 150 L 200 150 L 200 200"/>
    <circle cx="200" cy="200" r="3" fill="#00d4ff"/>
    <path d="M 1050 80 L 1050 130 L 1100 130 L 1100 180"/>
    <circle cx="1100" cy="180" r="3" fill="#ff6b35"/>
    <path d="M 900 320 L 900 270 L 950 270 L 950 220"/>
    <circle cx="950" cy="220" r="3" fill="#ff6b35"/>
    <path d="M 300 50 L 300 80 L 350 80"/>
    <circle cx="350" cy="80" r="3" fill="#00d4ff"/>
    <path d="M 800 350 L 800 300 L 750 300"/>
    <circle cx="750" cy="300" r="3" fill="#ff6b35"/>
  </g>

  <!-- Main title: Z.A.E.B.A.L. -->
  <text x="600" y="160" text-anchor="middle" font-family="'Courier New', monospace" font-size="80" font-weight="bold" fill="#00d4ff" filter="url(#neonBlue)" letter-spacing="8">
    Z.A.E.B.A.L.
  </text>

  <!-- Subtitle -->
  <text x="600" y="210" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" fill="#8899aa" letter-spacing="4">
    Zaebal? Audit. Errors. Break. Analyze. Leave no assumption.
  </text>

  <!-- Tagline -->
  <text x="600" y="255" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#ff6b35" filter="url(#neonOrange)" letter-spacing="2">
    Profanity-triggered self-audit protocol for coding agents
  </text>

  <!-- Badges area -->
  <g transform="translate(600, 310)">
    <!-- Python stdlib -->
    <rect x="-220" y="-15" width="130" height="30" rx="4" fill="#3776AB" opacity="0.9"/>
    <text x="-155" y="5" text-anchor="middle" font-family="Arial" font-size="11" fill="white" font-weight="bold">Python stdlib only</text>

    <!-- Hermes -->
    <rect x="-80" y="-15" width="100" height="30" rx="4" fill="#FF6B6B" opacity="0.9"/>
    <text x="-30" y="5" text-anchor="middle" font-family="Arial" font-size="11" fill="white" font-weight="bold">Hermes Agent</text>

    <!-- RU/EN -->
    <rect x="30" y="-15" width="90" height="30" rx="4" fill="#22D3EE" opacity="0.9"/>
    <text x="75" y="5" text-anchor="middle" font-family="Arial" font-size="11" fill="#0a0a1a" font-weight="bold">RU · EN</text>

    <!-- Fail-open -->
    <rect x="130" y="-15" width="100" height="30" rx="4" fill="#3FB950" opacity="0.9"/>
    <text x="180" y="5" text-anchor="middle" font-family="Arial" font-size="11" fill="#0a0a1a" font-weight="bold">fail-open ✓</text>
  </g>

  <!-- Decorative brackets -->
  <text x="50" y="180" font-family="'Courier New', monospace" font-size="60" fill="#ff6b35" opacity="0.2">{</text>
  <text x="1110" y="180" font-family="'Courier New', monospace" font-size="60" fill="#ff6b35" opacity="0.2">}</text>

  <!-- Bottom code line -->
  <text x="600" y="370" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#555" letter-spacing="1">
    $ echo "ты меня заебал" | python3 core/zaebal.py → &lt;zaebal level="1"&gt;
  </text>
</svg>
